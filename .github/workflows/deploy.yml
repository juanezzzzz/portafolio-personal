name: Deploy a GitHub Pages

# Compila el sitio con Vite y lo publica en GitHub Pages en cada push a main.
# No usa rama gh-pages: sube el build como artefacto y Pages lo sirve.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Permisos que necesita el deploy oficial de Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Un deploy a la vez; si llega uno nuevo mientras corre otro, este se cancela.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Build
        run: npm run build

      - name: Subir artefacto de Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar en Pages
        id: deployment
        uses: actions/deploy-pages@v4
